<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Live Proxy Player and m3u8 Stream Link Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(145deg, #0c1c3d, #1a2a4f);
      color: #cfd8e3;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .brand {
      color: #008cff;
      font-weight: bold;
      font-size: 32px;
    }
    .subtitle {
      color: #a0b3c5;
      font-size: 14px;
    }
    .header-logo {
      width: 60px;
      border-radius: 50%;
      border: 2px solid #00bcd4;
      box-shadow: 0 0 10px #00bcd4;
    }
    .btn-play {
      background: #008cff;
      color: #fff;
    }
    .btn-play:hover {
      background: #008cfc;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0,188,212,0.3);
      border-radius: 12px;
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .input-group input {
      background: rgba(255,255,255,0.1);
      color: #fff;
      border: none;
    }
    .input-group input:focus {
      background: white;
      color: black;
    }
    .share-text {
      background: #008cff;
      color: #fff;
      font-size: 14px;
    }
    footer {
      margin-top: 40px;
      font-size: 13px;
      color: #7a8ca4;
    }
    .social-icons a {
      margin: 0 8px;
      color: #81d4fa;
    }
    .loading-spinner {
      display: none;
    }
    .analytics-badge {
      background: rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div class="container py-4">
    <div class="text-center mb-3">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRWOGcbis8Xxgh_6H9uEAPJ0zZmIfjl-cT4t_u_lOlC8eYKlh3Rh9HPKTQ&s=10" class="header-logo mb-2">
      <div class="brand">YouTube Live</div>
      <p class="subtitle">Your personal YouTube live proxy player</p>
    </div>

    <div class="card p-3 mb-4">
      <div class="row g-2">
        <div class="col-md-8 col-12">
          <input type="text" id="link" class="form-control" placeholder="Paste YouTube Live URL here">
        </div>
        <div class="col-md-2 col-6 d-grid">
          <button onclick="playVideo()" class="btn btn-play">
            <i class="fas fa-play"></i> Play
          </button>
        </div>
        <div class="col-md-2 col-6 d-grid">
          <button onclick="addExample()" class="btn btn-secondary">
            Example
          </button>
        </div>
      </div>
    </div>

    <div id="loading" class="text-center loading-spinner mb-3">
      <div class="spinner-border text-info" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <div id="playerBox" style="display:none;">
      <div class="card mb-3">
        <div class="ratio ratio-16x9">
          <iframe id="ytFrame" allow="autoplay" allowfullscreen style="border-radius:12px;"></iframe>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Player Link:</label>
        <div class="input-group">
          <input type="text" id="playerLinkText" class="form-control share-text" readonly>
          <button class="btn btn-outline-info" onclick="copyToClipboard('playerLinkText')">
            <i class="fas fa-copy"></i>
          </button>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Embed Code:</label>
        <div class="input-group">
          <input type="text" id="embedLinkText" class="form-control share-text" readonly>
          <button class="btn btn-outline-info" onclick="copyToClipboard('embedLinkText')">
            <i class="fas fa-copy"></i>
          </button>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Stream Link (.m3u8):</label>
        <div class="input-group">
          <input type="text" id="streamLinkText" class="form-control share-text" readonly>
          <button class="btn btn-outline-info" onclick="copyToClipboard('streamLinkText')">
            <i class="fas fa-copy"></i>
          </button>
        </div>
      </div>
    </div>

    <footer class="text-center mt-3">
      <div>YT-live helps stream YouTube Live without buffering.</div>
      <div class="social-icons my-1">
        <a href="#"><i class="fab fa-facebook"></i></a>
        <a href="#"><i class="fab fa-twitter"></i></a>
        <a href="#"><i class="fab fa-github"></i></a>
        <a href="#"><i class="fab fa-youtube"></i></a>
      </div>
      <div>Developed by Fighter and ChatGPT 🚀</div>
    </footer>
  </div>

  <script>
    function playVideo() {
      const url = document.getElementById("link").value.trim();
      const match = url.match(/(?:v=|youtu\.be\/|\/live\/)([a-zA-Z0-9_-]{11})/);
      const videoId = match ? match[1] : null;
      if (!videoId) {
        alert("Please enter a valid YouTube video URL");
        return;
      }

      document.getElementById("loading").style.display = 'block';

      const baseApi = "https://yt-backend-m177.onrender.com";
      const streamUrl = `${baseApi}/stream?video_id=${videoId}`;
      const embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1`;

      setTimeout(() => {
        document.getElementById("ytFrame").src = embedUrl;
        document.getElementById("playerLinkText").value = embedUrl;
        document.getElementById("embedLinkText").value = `<iframe src="${embedUrl}" width="560" height="315" frameborder="0" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
        document.getElementById("streamLinkText").value = streamUrl;

        document.getElementById("playerBox").style.display = 'block';
        document.getElementById("loading").style.display = 'none';
        document.getElementById("playerBox").scrollIntoView({ behavior: 'smooth' });
      }, 100);
    }

    function addExample() {
      document.getElementById("link").value = "https://www.youtube.com/live/21X5lGlDOfg";
    }

    function copyToClipboard(id) {
      const text = document.getElementById(id).value;
      navigator.clipboard.writeText(text);
      alert("Copied!");
    }
  </script>
</body>
</html>
